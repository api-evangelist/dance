aid: dance
name: Dance
description: 'Dance is a Berlin-based electric mobility subscription company that offers
  e-bikes and e-mopeds as an all-in-one monthly subscription. A single fixed monthly
  fee bundles the vehicle together with on-demand repairs and maintenance, fast
  replacements, and theft protection, so members can ride without owning or servicing
  the hardware themselves. Dance operates in Berlin, Hamburg, and Paris, with product
  lines including the Dance One and Dance One Step e-bikes and the Dance Moped. Founded
  in 2020 by SoundCloud co-founders Alexander Ljung and Eric Quidenus-Wahlforss with
  Jimdo co-founder Christian Springub, Dance is a consumer-facing, app-based service
  backed by HV Capital. It does not currently publish a public developer API; this
  profile captures the company''s public web, help, and security surface.'
